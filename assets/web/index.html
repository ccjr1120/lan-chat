    list: $('list'), input: $('input'), send: $('sendBtn'), attach: $('attachBtn'), file: $('fileInput'),
    title: $('title'), status: $('status'), dot: $('dot'), peerCount: $('peerCount'), peerList: $('peerList'),
    peers: $('peers'), peersBtn: $('peersBtn'), rename: $('renameBtn'), banner: $('banner'),
    overlay: $('overlay'), overlayTitle: $('overlayTitle'), overlayDetail: $('overlayDetail'),
    overlaySpinner: $('overlaySpinner'), overlayBtn: $('overlayBtn'), drop: $('drop'), toast: $('toast')
  };

  var state = {
    ws: null, token: null, self: null, joined: false, rejected: false, closedByHost: false,
    messages: [], ids: {}, uploads: [], retry: 0, retryTimer: null,
    hostName: null, peers: []
  };
  // 动态文案以函数保存，切换语言时重新求值（状态、遮罩、横幅）。
  var dynamicText = { status: null, overlayTitle: null, overlayDetail: null, banner: null };

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  var deviceId = storageGet('lanchat.deviceId') || uuid();
  storageSet('lanchat.deviceId', deviceId);

  function defaultName() {
    var ua = navigator.userAgent;
    var os = /iPhone|iPad/.test(ua) ? 'iOS' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac'
      : /Windows/.test(ua) ? 'Windows' : /Linux/.test(ua) ? 'Linux' : t("设备");
    var br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox'
      : /Safari\//.test(ua) ? 'Safari' : t("浏览器");
    return os + ' ' + br + ' ' + deviceId.slice(0, 4).toUpperCase();
  }
  var myName = storageGet('lanchat.name') || defaultName();

  // ------------------------------------------------------------------ 工具
  function formatBytes(n) {
    if (n < 1024) return n + ' B';
    var units = ['KB', 'MB', 'GB', 'TB'], v = n / 1024, i = 0;
    while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
    return v.toFixed(v >= 100 ? 0 : 1) + ' ' + units[i];
  }
  function two(v) { return v < 10 ? '0' + v : '' + v; }
  function formatTime(ts) {
    var date = new Date(ts), now = new Date(), hm = two(date.getHours()) + ':' + two(date.getMinutes());
    if (date.toDateString() === now.toDateString()) return hm;
    var options = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false };
    if (date.getFullYear() !== now.getFullYear()) options.year = 'numeric';
    return date.toLocaleString(language, options);
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function fileUrl(file, download) {
    return '/api/files/' + encodeURIComponent(file.id) + '?token=' + encodeURIComponent(state.token || '') +
      (download ? '&download=1' : '');
  }
  function fileTag(file) {
    var m = /\.([A-Za-z0-9]{1,4})$/.exec(file.name);
    return m ? m[1].toUpperCase() : 'FILE';
  }
  var toastTimer = null;
  function toast(text) {
    els.toast.textContent = text; els.toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.hidden = true; }, 2500);
  }
  function atBottom() { return els.list.scrollHeight - els.list.scrollTop - els.list.clientHeight < 80; }
  function scrollBottom() { els.list.scrollTop = els.list.scrollHeight; }
  // ------------------------------------------------------------------ 渲染
  function renderMessage(m) {
    var isSelf = state.self && m.sender && m.sender.id === state.self.id;
    var row = el('div', 'msg' + (isSelf ? ' self' : ''));
    var who = isSelf ? t("我") : (m.sender ? m.sender.name : t("未知")) + (m.sender && m.sender.platform === 'host' ? t("（主机）") : '');
    row.appendChild(el('div', 'meta', who + ' · ' + formatTime(m.timestamp)));
    var bubble = el('div', 'bubble');
    if (m.kind === 'file') bubble.classList.add('file-card');
    if (m.kind === 'file' && m.file) {
      var f = m.file;
      if (/^image\//.test(f.mime)) {
        var img = el('img', 'preview');
        img.loading = 'lazy'; img.alt = f.name; img.src = fileUrl(f, false);
        var imgLink = el('a'); imgLink.href = fileUrl(f, false); imgLink.target = '_blank'; imgLink.rel = 'noopener';
        imgLink.appendChild(img);
        bubble.appendChild(imgLink);
      }
      var a = el('a', 'file');
      a.href = fileUrl(f, true);
      a.setAttribute('download', f.name);
      a.title = t("点击下载 ") + f.name;
      a.appendChild(el('div', 'icon', fileTag(f)));
      var info = el('div', 'info');
      info.appendChild(el('div', 'name', f.name));
      info.appendChild(el('div', 'size', formatBytes(f.size)));
      a.appendChild(info);
      a.appendChild(el('span', 'dl', t("下载")));
      bubble.appendChild(a);
    } else {
      bubble.textContent = m.text || '';
    }
    row.appendChild(bubble);
    return row;
  }

  function renderUpload(u) {
    var row = el('div', 'msg self');
    var box = el('div', 'bubble upload' + (u.error ? ' err' : ''));
    var head = el('div', 'file');
    head.appendChild(el('div', 'icon', fileTag({ name: u.name })));
    var info = el('div', 'info');
    info.appendChild(el('div', 'name', u.name));
    var pct = u.size > 0 ? Math.min(100, Math.round(u.sent / u.size * 100)) : 0;
    info.appendChild(el('div', 'status', u.error ? u.error : formatBytes(u.sent) + ' / ' + formatBytes(u.size) + '  ' + pct + '%'));
    head.appendChild(info);
    var btn = el('button', 'btn', u.error ? t("移除") : t("取消"));
    btn.type = 'button';
    btn.addEventListener('click', function () {
      if (!u.error && u.xhr) u.xhr.abort();
      removeUpload(u);
    });
    head.appendChild(btn);
    box.appendChild(head);
    if (!u.error) {
      var bar = el('div', 'progress'), fill = el('div');
      fill.style.width = pct + '%';
      bar.appendChild(fill);
      box.appendChild(bar);
    }
    row.appendChild(box);
    return row;
  }

  function renderAll() {
    var stick = atBottom();
    els.list.textContent = '';
    if (!state.messages.length && !state.uploads.length) {
      var empty = el('div', 'empty');
      var icon = el('div', 'empty-icon');
      icon.appendChild(document.querySelector('.brand-mark svg').cloneNode(true));
      empty.appendChild(icon);
      empty.appendChild(el('h2', null, t("连接好了，开始互传吧")));
      empty.appendChild(el('p', null, t("发送文字，或把文件拖到这里。")));
      els.list.appendChild(empty);
      return;
    }
    var frag = document.createDocumentFragment();
    state.messages.forEach(function (m, index) {
      var prev = state.messages[index - 1];
      var separated = !prev || m.timestamp - prev.timestamp > 5 * 60 * 1000;
      if (separated) frag.appendChild(el('div', 'time-divider', formatTime(m.timestamp)));
      var row = renderMessage(m);
      if (!separated && prev.sender && m.sender && prev.sender.id === m.sender.id) row.querySelector('.meta').hidden = true;
      frag.appendChild(row);
    });
    state.uploads.forEach(function (u) { frag.appendChild(renderUpload(u)); });
    els.list.appendChild(frag);
    if (stick) scrollBottom();
  }

  function addMessage(m) {
    if (!m || !m.id || state.ids[m.id]) return false;
    state.ids[m.id] = true;
    state.messages.push(m);
    return true;
  }

  function renderTitle() {
    if (!state.hostName) {
      document.title = t('局域网互传');
      if (state.joined) els.title.textContent = $('sidebarTitle').textContent = t('局域网互传');
      return;
    }
    els.title.textContent = state.hostName;
    $('sidebarTitle').textContent = state.hostName;
    document.title = state.hostName + t(" · 局域网互传");
  }

  function renderPeers(peers) {
    state.peers = peers;
    els.peerCount.textContent = peers.length;
    els.peerList.textContent = '';
    var labels = { host: t("主机"), app: 'App', web: t("网页") };
    peers.forEach(function (p) {
      var li = el('li', null, p.name + (state.self && p.id === state.self.id ? t("（我）") : ''));
      li.appendChild(el('small', null, labels[p.platform] || p.platform));
      els.peerList.appendChild(li);
    });
  }

  function setStatus(text, kind) {
    dynamicText.status = text;
    els.status.textContent = text();
    els.dot.className = 'dot' + (kind ? ' ' + kind : '');
  }
  function setBanner(text) {
    dynamicText.banner = text;
    els.banner.hidden = !text;
    if (text) els.banner.textContent = text();
  }

  function setEnabled(on) {
    els.input.disabled = !on; els.send.disabled = !on || !els.input.value.trim(); els.attach.disabled = !on;
  }

  function showOverlay(title, detail, opts) {
    opts = opts || {};
    els.overlay.hidden = false;
    dynamicText.overlayTitle = title;
    dynamicText.overlayDetail = detail;
    els.overlayTitle.textContent = title();
    els.overlayDetail.textContent = detail ? detail() : '';
    els.overlaySpinner.hidden = !opts.spinner;
    els.overlayBtn.hidden = !opts.button;
  }
  function hideOverlay() { els.overlay.hidden = true; }
  // ------------------------------------------------------------------ WebSocket
  function connect() {
    clearTimeout(state.retryTimer);
    if (state.rejected) return;
    var proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
    var ws;
    try { ws = new WebSocket(proto + location.host + '/ws'); } catch (e) { scheduleRetry(); return; }
    state.ws = ws;
    setStatus(function () { return t("正在连接…"); }, 'warn');
    if (!state.joined && !state.messages.length) {
      showOverlay(function () { return t("正在连接主机…"); }, function () { return location.host; }, { spinner: true });
    }

    ws.onopen = function () {
      ws.send(JSON.stringify({ type: 'hello', data: { deviceId: deviceId, name: myName, platform: 'web' } }));
    };
    ws.onmessage = function (ev) {
      var e;
      try { e = JSON.parse(ev.data); } catch (err) { return; }
      if (!e || typeof e.type !== 'string') return;
      handle(e.type, e.data);
    };
    ws.onclose = function () {
      if (state.ws !== ws) return;
      state.ws = null; state.joined = false; state.token = null;
      setEnabled(false);
      if (state.rejected) return;
      scheduleRetry();
    };
    ws.onerror = function () { /* onclose 统一处理 */ };
  }

  function scheduleRetry() {
    state.retry++;
    var delay = Math.min(15, Math.pow(2, Math.min(state.retry - 1, 4)));
    var closedByHost = state.closedByHost;
    function reason() { return closedByHost ? t("主机已结束会话") : t("连接已断开"); }
    setStatus(function () { return reason() + t('，') + delay + t(" 秒后重试"); }, 'bad');
    setBanner(function () { return reason() + t("，正在自动重连…"); });
    state.retryTimer = setTimeout(connect, delay * 1000);
  }

  function handle(type, data) {
    switch (type) {
      case 'pending':
        setStatus(function () { return t("等待主机确认"); }, 'warn');
        showOverlay(function () { return t("等待主机确认"); }, function () { return t("已向主机发送加入请求，请在主机 App 上点击“同意”"); }, { spinner: true });
        break;
      case 'welcome':
        state.token = data.token;
        state.self = data.self;
        state.joined = true;
        state.retry = 0;
        state.closedByHost = false;
        state.hostName = data.host && data.host.name ? data.host.name : null;
        renderTitle();
        setStatus(function () { return t("已连接"); }, 'ok');
        setBanner(null);
        hideOverlay();
        setEnabled(true);
        break;
      case 'rejected':
        state.rejected = true;
        setStatus(function () { return t("已被拒绝"); }, 'bad');
        setEnabled(false);
        var reason = data && data.reason;
        showOverlay(function () { return t("无法加入会话"); }, function () { return diagnostic(reason) || t("主机拒绝了你的加入请求"); }, { button: true });
        break;
      case 'peers':
        renderPeers(Array.isArray(data) ? data : []);
        break;
      case 'history':
        state.messages = []; state.ids = {};
        (Array.isArray(data) ? data : []).forEach(addMessage);
        renderAll();
        scrollBottom();
        break;
      case 'message':
        var stick = atBottom() || (state.self && data && data.sender && data.sender.id === state.self.id);
        if (addMessage(data)) { renderAll(); if (stick) scrollBottom(); }
        break;
      case 'error':
        if (data && data.message) {
          if (/结束会话/.test(data.message)) state.closedByHost = true;
          toast(diagnostic(data.message));
        }
        break;
    }
  }

  function sendText() {
    var text = els.input.value.trim();
    if (!text || !state.ws || !state.joined) return;
    state.ws.send(JSON.stringify({ type: 'message', data: { text: text } }));
    els.input.value = '';
    autosize();
    els.input.focus();
  }
  // ------------------------------------------------------------------ 上传（XHR 显示进度）
  var uploadQueue = [];
  var uploading = false;

  function removeUpload(u) {
    var i = state.uploads.indexOf(u);
    if (i >= 0) state.uploads.splice(i, 1);
    var q = uploadQueue.indexOf(u);
    if (q >= 0) uploadQueue.splice(q, 1);
    renderAll();
  }

  function enqueueFiles(fileList) {
    if (!state.joined) { toast(t("尚未连接到主机")); return; }
    Array.prototype.forEach.call(fileList, function (file) {
      var u = { file: file, name: file.name, size: file.size, sent: 0, error: null, xhr: null };
      state.uploads.push(u);
      uploadQueue.push(u);
    });
    renderAll();
    scrollBottom();
    pump();
  }

  // 逐个上传，避免并发占满局域网带宽。
  function pump() {
    if (uploading) return;
    var u = uploadQueue.shift();
    if (!u) return;
    uploading = true;
    var form = new FormData();
    form.append('file', u.file, u.name);
    var xhr = new XMLHttpRequest();
    u.xhr = xhr;
    xhr.open('POST', '/api/upload?name=' + encodeURIComponent(u.name) + '&token=' + encodeURIComponent(state.token || ''));
    var lastRender = 0;
    xhr.upload.onprogress = function (ev) {
      if (!ev.lengthComputable) return;
      u.sent = Math.min(ev.loaded, u.size);
      var now = Date.now();
      if (now - lastRender > 100) { lastRender = now; renderAll(); }
    };
    xhr.onload = function () {
      if (xhr.status >= 200 && xhr.status < 300) {
        var m = null;
        try { m = JSON.parse(xhr.responseText); } catch (e) { /* 以 WS 广播为准 */ }
        removeUpload(u);
        if (m && addMessage(m)) { renderAll(); scrollBottom(); }
      } else {
        var msg = t("上传失败（HTTP ") + xhr.status + t('）');
        try { var body = JSON.parse(xhr.responseText); if (body && body.error) msg = diagnostic(body.error); } catch (e) { /* 忽略 */ }
        u.error = msg;
        renderAll();
      }
      done();
    };
    xhr.onerror = function () { u.error = t("网络错误，上传失败"); renderAll(); done(); };
    xhr.onabort = function () { done(); };
    function done() { u.xhr = null; uploading = false; pump(); }
    xhr.send(form);
  }

  // ------------------------------------------------------------------ 交互
  function autosize() {
    els.send.disabled = !state.joined || !els.input.value.trim();
    els.input.style.height = 'auto';
    els.input.style.height = Math.min(els.input.scrollHeight, 140) + 'px';
  }

  els.input.addEventListener('input', autosize);
  els.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendText(); }
  });
  els.send.addEventListener('click', sendText);
  els.attach.addEventListener('click', function () { els.file.click(); });
  els.file.addEventListener('change', function () {
    if (els.file.files && els.file.files.length) enqueueFiles(els.file.files);
    els.file.value = '';
  });
  function closePeers() {
    els.peers.classList.remove('show');
    $('peerBackdrop').classList.remove('show');
    els.peersBtn.setAttribute('aria-expanded', 'false');
    els.peersBtn.focus();
  }
  els.peersBtn.addEventListener('click', function () {
    var open = els.peers.classList.toggle('show');
    $('peerBackdrop').classList.toggle('show', open);
    els.peersBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) $('peerClose').focus();
  });
  $('peerClose').addEventListener('click', closePeers);
  $('peerBackdrop').addEventListener('click', closePeers);
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && els.peers.classList.contains('show')) closePeers();
  });
  els.rename.addEventListener('click', function () {
    $('nameInput').value = myName;
    $('nameDialog').showModal();
    $('nameInput').focus();
    $('nameInput').select();
  });
  $('nameCancel').addEventListener('click', function () { $('nameDialog').close(); });
  $('nameForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var name = $('nameInput').value.trim().slice(0, 32);
    if (!name) { $('nameInput').focus(); return; }
    $('nameDialog').close();
    if (name === myName) return;
    myName = name;
    storageSet('lanchat.name', name);
    toast(t("名称已修改，重新连接后生效"));
    if (state.ws) state.ws.close();
  });
  els.overlayBtn.addEventListener('click', function () {
    state.rejected = false; state.retry = 0;
    connect();
  });

  // ------------------------------------------------------------------ 设置（主题、语言）
  // 与 App SettingsMenu 一致：主题 system / light / dark，语言 system / zh-CN / en，保存在 localStorage。
  var themePref = storageGet('lanchat.theme');
  if (themePref !== 'light' && themePref !== 'dark') themePref = 'system';
  function applyTheme(value) {
    themePref = value;
    if (value === 'system') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = value;
    storageSet('lanchat.theme', value);
  }
  function applyLanguage(value) {
    languagePref = value;
    storageSet('lanchat.language', value);
    var next = value === 'system' ? systemLanguage() : value;
    if (next === language) return;
    language = next;
    translatePage();
    // 动态区域按新语言重新渲染；用户消息、文件名、设备名保持原值。
    if (dynamicText.status) els.status.textContent = dynamicText.status();
    if (dynamicText.banner) els.banner.textContent = dynamicText.banner();
    if (dynamicText.overlayTitle) els.overlayTitle.textContent = dynamicText.overlayTitle();
    els.overlayDetail.textContent = dynamicText.overlayDetail ? dynamicText.overlayDetail() : '';
    renderTitle();
    renderPeers(state.peers);
    renderAll();
  }
  var settingsBtn = $('settingsBtn'), settingsMenu = $('settingsMenu');
  function syncSettingsMenu() {
    settingsMenu.querySelectorAll('input[name=theme]').forEach(function (input) { input.checked = input.value === themePref; });
    settingsMenu.querySelectorAll('input[name=language]').forEach(function (input) { input.checked = input.value === languagePref; });
  }
  function setSettingsOpen(open, restoreFocus) {
    settingsMenu.hidden = !open;
    settingsBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if (open) {
      syncSettingsMenu();
      var checked = settingsMenu.querySelector('input:checked');
      if (checked) checked.focus();
    } else if (restoreFocus) {
      settingsBtn.focus();
    }
  }
  settingsBtn.addEventListener('click', function () { setSettingsOpen(settingsMenu.hidden, true); });
  settingsMenu.addEventListener('change', function (event) {
    var input = event.target;
    if (input.name === 'theme') applyTheme(input.value);
    if (input.name === 'language') applyLanguage(input.value);
  });
  document.addEventListener('click', function (event) {
    if (!settingsMenu.hidden && !event.target.closest('.settings')) setSettingsOpen(false, false);
  });
  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && !settingsMenu.hidden) setSettingsOpen(false, true);
  });
  // 跟随系统时，系统语言变化后同步更新界面。
  window.addEventListener('languagechange', function () { if (languagePref === 'system') applyLanguage('system'); });

  // 拖拽上传：dragenter/dragleave 计数，避免子元素触发闪烁。
  var dragDepth = 0;
  function hasFiles(e) {
    return e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0;
  }
  window.addEventListener('dragenter', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth++;
    if (state.joined) els.drop.hidden = false;
  });
  window.addEventListener('dragover', function (e) { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('dragleave', function (e) {
    if (!hasFiles(e)) return;
    dragDepth = Math.max(0, dragDepth - 1);
    if (!dragDepth) els.drop.hidden = true;
  });
  window.addEventListener('drop', function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault(); dragDepth = 0; els.drop.hidden = true;
    if (e.dataTransfer.files && e.dataTransfer.files.length) enqueueFiles(e.dataTransfer.files);
  });
  // 支持直接粘贴截图等文件。
  els.input.addEventListener('paste', function (e) {
    var files = e.clipboardData && e.clipboardData.files;
    if (files && files.length) { e.preventDefault(); enqueueFiles(files); }
  });

  renderAll();
  connect();
})();
</script>
</body>
</html>
