name: lan_chat
description: "局域网内手机与电脑之间的文字与文件互传应用（App 主机内置 HTTP + WebSocket 服务，网页端免安装接入）。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3
  shelf: 1.4.2
  shelf_router: 1.1.4
  shelf_web_socket: 3.0.0
  web_socket_channel: 3.0.3
  dio: 5.11.1
  bonsoir: 7.1.5
  file_picker: 13.1.0
  qr_flutter: 4.1.0
  lucide_icons_flutter: 3.1.24
  network_info_plus: 8.2.1
  path_provider: 2.1.6
  open_filex: 4.7.0
  share_plus: 13.3.1
  mime: 2.1.0
  uuid: 4.6.0
  path: 1.9.1

dev_dependencies:
  flutter_lints: 6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/web/
